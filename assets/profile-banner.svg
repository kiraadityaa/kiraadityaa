<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Adityaa — MasAdityaa.lua, Lua Developer Roblox banner">
  <title>Adityaa — MasAdityaa.lua | Lua Developer Roblox</title>
  <desc>Catppuccin Mocha profile banner for Adityaa (MasAdityaa.lua), a Lua Developer focused on Roblox, also building with Python, TypeScript and Next.js. Left wordmark with stack pills, right Luau terminal with connection ring.</desc>

  <style>
    .bg           { fill: #11111b; }
    .card         { fill: #1e1e2e; stroke: #313244; }
    .accent       { fill: #cba6f7; }
    .divider      { fill: #45475a; }
    .pill         { fill: #313244; stroke: #45475a; }
    .t-title      { fill: #cdd6f4; }
    .t-sub        { fill: #a6adc8; }
    .alias-text   { fill: #cba6f7; }
    .dot-lua      { fill: #89b4fa; }
    .dot-py       { fill: #f9e2af; }
    .dot-ts       { fill: #74c7ec; }
    .dot-next     { fill: #b4befe; }
    .term-body    { fill: #181825; stroke: #45475a; }
    .term-head    { fill: #313244; }
    .term-status  { fill: #313244; }
    .moon         { fill: #89b4fa; }
    .moon-cut     { fill: #181825; }
    .red          { fill: #f38ba8; }
    .yellow       { fill: #f9e2af; }
    .green        { fill: #a6e3a1; }
    .teal         { fill: #94e2d5; }
    .blue         { fill: #89b4fa; }
    .sky          { fill: #89dceb; }
    .mono-bright  { fill: #cdd6f4; }
    .mono-dim     { fill: #a6adc8; }
    .ring1        { fill: none; stroke: #cba6f7; }
    .ring2        { fill: none; stroke: #94e2d5; }
  </style>

  <!-- Full-bleed base so contrast holds on any GitHub theme -->
  <rect x="0" y="0" width="1200" height="400" class="bg"/>
  <!-- Card: every text sits on this or a nested filled shape -->
  <rect x="16" y="16" width="1168" height="368" rx="24" class="card" stroke-width="2"/>

  <!-- Slim left accent -->
  <rect x="56" y="72" width="4" height="256" rx="2" class="accent"/>

  <!-- Left identity column -->
  <g transform="translate(88,0)">
    <text x="0" y="146" font-size="68" font-weight="800" letter-spacing="-1" class="t-title">Adityaa</text>

    <!-- Alias pill -->
    <rect x="0" y="166" width="216" height="38" rx="19" class="pill" stroke-width="1.5"/>
    <circle cx="24" cy="185" r="6" class="accent"/>
    <text x="40" y="191" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" class="alias-text">MasAdityaa.lua</text>

    <text x="2" y="238" font-size="22" font-weight="600" class="t-sub">Lua Developer | Roblox</text>
    <rect x="0" y="256" width="464" height="2" rx="1" class="divider"/>

    <!-- Stack pills row 1 -->
    <rect x="0" y="276" width="236" height="42" rx="21" class="pill" stroke-width="1.5"/>
    <circle cx="22" cy="297" r="6" class="dot-lua"/>
    <text x="38" y="303" font-size="16" font-weight="600" class="t-title">Lua (Roblox)</text>

    <rect x="248" y="276" width="216" height="42" rx="21" class="pill" stroke-width="1.5"/>
    <circle cx="270" cy="297" r="6" class="dot-py"/>
    <text x="286" y="303" font-size="16" font-weight="600" class="t-title">Python</text>

    <!-- Stack pills row 2 -->
    <rect x="0" y="330" width="236" height="42" rx="21" class="pill" stroke-width="1.5"/>
    <circle cx="22" cy="351" r="6" class="dot-ts"/>
    <text x="38" y="357" font-size="16" font-weight="600" class="t-title">TypeScript</text>

    <rect x="248" y="330" width="216" height="42" rx="21" class="pill" stroke-width="1.5"/>
    <circle cx="270" cy="351" r="6" class="dot-next"/>
    <text x="286" y="357" font-size="16" font-weight="600" class="t-title">Next.js</text>
  </g>

  <!-- Connection rings behind terminal (remote/dev motif) -->
  <circle cx="932" cy="200" r="142" class="ring1" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round" opacity="0.28"/>
  <circle cx="932" cy="200" r="120" class="ring2" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.22"/>

  <!-- Terminal window -->
  <g>
    <rect x="740" y="76" width="388" height="248" rx="16" class="term-body" stroke-width="2"/>
    <!-- Header with top rounding only (rounded rect + square overlap, same fill) -->
    <rect x="740" y="76" width="388" height="44" rx="16" class="term-head"/>
    <rect x="740" y="104" width="388" height="16" class="term-head"/>
    <circle cx="764" cy="98" r="6" class="red"/>
    <circle cx="786" cy="98" r="6" class="yellow"/>
    <circle cx="808" cy="98" r="6" class="green"/>
    <text x="828" y="103" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" class="mono-dim">masadityaa - luau</text>
    <!-- Lua moon mark in header -->
    <circle cx="1084" cy="98" r="14" class="moon"/>
    <circle cx="1079" cy="93" r="5" class="moon-cut"/>

    <!-- Code lines on terminal body (parent carries fallback fill; tspans override per token) -->
    <text x="764" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" class="mono-dim"><tspan class="teal">$ </tspan><tspan class="mono-bright">luau run game.server.luau</tspan></text>
    <text x="764" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" class="mono-dim"><tspan class="blue">RemoteEvent</tspan><tspan class="mono-dim">:FireServer(player)</tspan></text>
    <text x="764" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" class="mono-dim"><tspan class="green">OK </tspan><tspan class="mono-dim">quest automation ready</tspan></text>
    <text x="764" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" class="mono-dim"><tspan class="teal">$ </tspan><tspan class="mono-bright">next build</tspan><tspan class="mono-dim"> --turbopack</tspan></text>
    <text x="764" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" class="mono-bright">&gt; </text>
    <rect x="784" y="248" width="9" height="18" class="sky"/>

    <!-- Status bar with bottom rounding only -->
    <rect x="740" y="288" width="388" height="36" rx="16" class="term-status"/>
    <rect x="740" y="288" width="388" height="20" class="term-status"/>
    <circle cx="764" cy="306" r="5" class="green"/>
    <text x="778" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" class="mono-dim">roblox-studio - connected</text>
  </g>
</svg>
