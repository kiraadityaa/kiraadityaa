<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Adityaa — Lua (Roblox) developer banner">
  <title>Adityaa — Lua (Roblox) Developer</title>
  <desc>Catppuccin Mocha banner for Adityaa, a Lua/Roblox developer who also builds with Python, TypeScript and Next.js.</desc>

  <style>
    .card    { fill: #1e1e2e; stroke: #313244; }
    .ring    { fill: none; stroke: #45475a; }
    .ring-dt { fill: none; stroke: #585b70; }
    .t-title { fill: #cdd6f4; }
    .t-mono  { fill: #f5e0dc; }
    .t-sub   { fill: #a6adc8; }
    .t-mute  { fill: #6c7086; }
    .mauve   { fill: #cba6f7; }
    .blue    { fill: #89b4fa; }
    .green   { fill: #a6e3a1; }
    .peach   { fill: #fab387; }
    .red     { fill: #f38ba8; }
    .surface { fill: #313244; }
    .surface-2 { fill: #45475a; }
    .terminal { fill: #11111b; stroke: #45475a; }
    .cursor  { fill: #89b4fa; }
    @media (prefers-color-scheme: light) {
      .card { fill: #232338; }
    }
  </style>

  <!-- Card background -->
  <rect x="16" y="16" width="1168" height="368" rx="28" class="card" stroke-width="2"/>

  <!-- Decorative connection ring (remote / script scene) -->
  <g transform="translate(60,60)">
    <circle cx="150" cy="140" r="118" class="ring" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>
    <circle cx="150" cy="140" r="96" class="ring-dt" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"/>
  </g>

  <!-- Terminal panel (left) -->
  <g transform="translate(58,150)">
    <rect x="0" y="0" width="210" height="128" rx="16" class="terminal" stroke-width="2"/>
    <!-- dots -->
    <circle cx="24" cy="24" r="6" class="red"/>
    <circle cx="46" cy="24" r="6" class="peach"/>
    <circle cx="68" cy="24" r="6" class="green"/>
    <rect x="96" y="18" width="88" height="12" rx="6" class="surface" opacity="0.9"/>
    <!-- prompt -->
    <text x="24" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" class="t-sub">adityaa@roblox</text>
    <text x="24" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" class="green">$&gt;</text>
    <text x="44" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" class="t-mono">script.Parent</text>
    <rect x="208" y="80" width="2" height="20" class="cursor"/>
  </g>

  <!-- Lua accent glyph (right, above wordmark) -->
  <g transform="translate(224,96)">
    <rect x="0" y="0" width="52" height="52" rx="12" class="surface-2"/>
    <text x="26" y="37" text-anchor="middle" font-size="26" font-weight="800" class="mauve">lua</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(232,132)">
    <text x="0" y="0" font-size="62" font-weight="800" class="t-title">Adityaa</text>
    <text x="58" y="40" font-size="20" font-weight="600" class="t-sub">MasAdityaa.lua</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(232,214)">
    <text x="0" y="0" font-size="24" class="t-sub">Lua (Roblox)</text>
    <line x1="188" y1="0" x2="204" y2="0" class="surface-2"/>
    <text x="0" y="34" font-size="24" class="t-sub">Python</text>
    <line x1="112" y1="34" x2="128" y2="34" class="surface-2"/>
    <text x="0" y="68" font-size="24" class="t-sub">TypeScript</text>
    <line x1="150" y1="68" x2="166" y2="68" class="surface-2"/>
    <text x="224" y="34" font-size="24" class="t-sub">Next.js</text>

    <circle cx="24" cy="-13" r="6" class="mauve"/>
    <circle cx="24" cy="21" r="6" class="green"/>
    <circle cx="24" cy="55" r="6" class="blue"/>
    <circle cx="248" cy="21" r="6" class="peach"/>
  </g>

  <!-- Badge pills (contacts row) -->
  <g transform="translate(232,320)">
    <g>
      <rect x="0" y="0" width="150" height="40" rx="20" class="surface" stroke-width="1.5" stroke="#45475a"/>
      <circle cx="26" cy="20" r="5" class="red"/>
      <text x="42" y="26" font-size="15" font-weight="600" class="t-mono">aaaditz_</text>
    </g>
    <g transform="translate(162,0)">
      <rect x="0" y="0" width="150" height="40" rx="20" class="surface" stroke-width="1.5" stroke="#45475a"/>
      <circle cx="26" cy="20" r="5" class="green"/>
      <text x="42" y="26" font-size="15" font-weight="600" class="t-mono">kiraadityaa</text>
    </g>
    <g transform="translate(324,0)">
      <rect x="0" y="0" width="150" height="40" rx="20" class="surface" stroke-width="1.5" stroke="#45475a"/>
      <circle cx="26" cy="20" r="5" class="blue"/>
      <text x="42" y="26" font-size="15" font-weight="600" class="t-mono">6281553362795</text>
    </g>
  </g>

  <!-- Floating stars / sparkles in the background -->
  <g>
    <rect x="978" y="74" width="8" height="8" rx="2" class="mauve" opacity="0.7"/>
    <rect x="1014" y="120" width="6" height="6" rx="1.5" class="peach" opacity="0.6"/>
    <rect x="944" y="136" width="5" height="5" rx="1" class="green" opacity="0.5"/>
    <rect x="1006" y="212" width="7" height="7" rx="2" class="blue" opacity="0.6"/>
    <rect x="1056" y="160" width="9" height="9" rx="2" class="surface-2"/>
    <rect x="1094" y="236" width="6" height="6" rx="1.5" class="mauve" opacity="0.5"/>
    <rect x="1060" y="84" width="5" height="5" rx="1" class="t-mute" opacity="0.5"/>
  </g>

  <!-- Side hint (discord / scripting vibe) -->
  <g transform="translate(1060,300)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="0" y="0" font-size="14" class="t-mute">&gt; while true do</text>
    <text x="0" y="22" font-size="14" class="t-mute">  build( stuff )</text>
    <text x="0" y="44" font-size="14" class="t-mute">end</text>
  </g>
</svg>